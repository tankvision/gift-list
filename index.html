<style>
/* Alt C — Candy cane dark, compact. One phone column. */
:root {
  --bg: #141012; --card: #1F191B; --line: #2E2528; --inset: #171214; --dash: #4A3D40;
  --ink: #F6EFE4; --soft: #CFC4BD; --muted: #B5A9A3;
  --berry: #C23A50; --berry-2: #E0667A; --pink: #FF8A9B; --green: #5FC48F; --gold: #F2C14E;
  --idea-seg: #5A4F4C;
  --idea-bg: #2B2326; --idea-fg: #CFC4BD;
  --ordered-bg: #1C2A38; --ordered-fg: #9CC7EE;
  --bought-bg: #17302A; --bought-fg: #7FD8A8;
  --wrapped-bg: #3A1820; --wrapped-fg: #FF8A9B;
  --given-bg: #3A2E14; --given-fg: #F2C14E;
  --blue-bg: #1C2A38; --blue-fg: #9CC7EE;
  --scrim: rgba(0, 0, 0, 0.62);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {

  font-family: var(--body); font-size: 16px; line-height: 1.4;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 100px);   /* room for the floating gift button */
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: 0.55; }
button:focus-visible, input:focus-visible, textarea:focus-visible, .seg label:focus-within { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.num { font-variant-numeric: tabular-nums; }

.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: -4px; }

.ring { flex-shrink: 0; width: 56px; height: 56px; border-radius: 50%; background: repeating-linear-gradient(135deg, var(--berry) 0 6px, var(--ink) 6px 12px); display: flex; align-items: center; justify-content: center; }
.ring-in { width: 45px; height: 45px; border-radius: 50%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }

.ring-n.long { font-size: 15px; }
.ring-l { font-size: 8px; font-weight: 700; letter-spacing: 0.06em; color: var(--pink); margin-top: 1px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
.stats { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat-l { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.stat-v { font-family: var(--display); font-weight: 800; font-size: clamp(19px, 6vw, 26px); line-height: 1.15; white-space: nowrap; }
.stat-v.pink { color: var(--pink); }
.stat-v.gold { color: var(--gold); }
.stat-btn { background: none; border: 0; padding: 0; text-align: left; color: inherit; min-height: 44px; border-radius: 8px; }
.stat-btn .stat-l { display: inline-flex; align-items: center; gap: 4px; }
.stat-note { font-size: 12px; font-weight: 700; line-height: 1.25; color: var(--gold); }
.head-r { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.privbtn { width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--soft); }
.privbtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
/* Privacy mode: blur amounts and gift details everywhere; people's names stay readable */
html.private .stat-v, html.private .mv, html.private .amt, html.private .g-item, html.private .g-sub, html.private .g-note,
html.private .kids-sum, html.private .kid-amt, html.private .kids-note, html.private .pc-money, html.private .who-name small {
  filter: blur(7px); -webkit-user-select: none; user-select: none;
}
.sortbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -6px 2px -8px; font-size: 13px; color: var(--muted); }
.sortbtn { min-height: 40px; padding: 0 12px; display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--soft); font-size: 13px; font-weight: 700; }
.setlink { background: none; border: 0; padding: 0; min-height: 44px; text-align: left; color: var(--gold); font-size: 15px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.cane { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; }
.cane > span { display: block; height: 100%; border-radius: 999px; background: repeating-linear-gradient(135deg, var(--berry) 0 6px, var(--berry-2) 6px 12px); transition: width .3s ease; }
.cane > span.over { background: var(--gold); }

/* Slim bar that pins to the top once the big summary card scrolls away */
.mini {
  position: fixed; top: 0; left: 0; right: 0; z-index: 15;
  background: var(--card); border-bottom: 1px solid var(--line); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
  padding: calc(env(safe-area-inset-top, 0px) + 8px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  transform: translateY(-100%); opacity: 0; visibility: hidden;
  transition: transform .22s ease, opacity .22s ease, visibility 0s linear .22s;
}
.mini.on { transform: none; opacity: 1; visibility: visible; transition: transform .22s ease, opacity .22s ease; }
.mini-in { display: flex; flex-direction: column; gap: 7px; width: 100%; max-width: 560px; margin: 0 auto; padding: 0; background: none; border: 0; text-align: left; color: inherit; }
.mini-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 6px; align-items: end; }
.m { display: flex; flex-direction: column; min-width: 0; }
.ml { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.mv { font-family: var(--display); font-weight: 800; font-size: clamp(14px, 4.2vw, 17px); line-height: 1.15; white-space: nowrap; }
.mv.pink { color: var(--pink); }
.mv.gold { color: var(--gold); }
.m.days { text-align: right; }
.mini .cane { display: block; height: 6px; }
.mix { display: flex; flex-direction: column; gap: 8px; }
.mix-bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--line); }
.mix-bar > span { display: block; height: 100%; }
.mix-legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 13px; font-weight: 600; }
.c-idea { color: var(--soft); } .c-ordered { color: var(--ordered-fg); } .c-bought { color: var(--bought-fg); } .c-wrapped { color: var(--pink); } .c-given { color: var(--gold); }

/* Kids side by side */
.kids { display: flex; flex-direction: column; }
.kids-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 52px; padding: 8px 8px 8px 16px; background: none; border: 0; border-radius: 18px; text-align: left; color: inherit; }
.kids-t { min-width: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; }
.kids-name { font-family: var(--display); font-weight: 700; font-size: 18px; }
.kids-sub { font-size: 13px; color: var(--muted); }
.kids-sum { font-size: 14px; color: var(--soft); }
.chev { width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.kids-rows { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 12px; }
.kid-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
.kid-name { font-weight: 700; overflow-wrap: anywhere; }
.kid-name small { font-weight: 500; font-size: 13px; color: var(--muted); }
.kid-amt { font-weight: 700; text-align: right; }
.kid-bar { grid-column: 1 / -1; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.kid-bar > span { display: block; height: 100%; border-radius: 999px; background: var(--ordered-fg); }
.kids-note { font-size: 13px; color: var(--muted); margin: 0; }

.switch { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
.switch button { min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--soft); font-size: 14px; font-weight: 600; }
.switch button[aria-pressed="true"] { background: var(--berry); color: #FFFFFF; font-weight: 700; }

.list { display: flex; flex-direction: column; overflow: hidden; }
.row { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row.open { padding-top: 14px; }
.row-top { display: flex; align-items: center; gap: 12px; }
/* Person row: the whole row opens the card; the Set budget pill is its own button on top */
.prow { position: relative; flex-direction: row; align-items: center; gap: 12px; min-height: 64px; }
.prow-hit { position: absolute; inset: 0; z-index: 0; width: 100%; padding: 0; border: 0; border-radius: 0; background: none; }
.prow-hit:active { background: var(--inset); }
.prow-hit:focus-visible { outline-offset: -3px; }
.prow > :not(.prow-hit) { position: relative; z-index: 1; pointer-events: none; }
.prow > .budget-pill { pointer-events: auto; }
.budget-pill { flex-shrink: 0; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--gold); background: var(--given-bg); color: var(--gold); font-size: 13px; font-weight: 700; white-space: nowrap; }
.go { flex-shrink: 0; display: flex; color: var(--muted); margin-right: -4px; }
.star { margin-left: 5px; font-size: 0.8em; vertical-align: 1px; }
.avatar, .av-st { width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
.av-st i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.av-0 { background: var(--bought-bg); color: var(--bought-fg); }

.av-3 { background: var(--blue-bg); color: var(--blue-fg); }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; background: none; border: 0; padding: 0; text-align: left; border-radius: 8px; }
.who-name { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }

.who-name small.over { font-weight: 700; color: var(--gold); }
.kid { display: inline-block; vertical-align: 2px; margin-left: 4px; padding: 1px 6px; border-radius: 6px; background: var(--ordered-bg); color: var(--ordered-fg); font-size: 10px; font-weight: 800; letter-spacing: 0.08em; }
.thin { display: block; height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }

.amt { text-align: right; font-size: 15px; font-weight: 700; white-space: nowrap; }

.setbudget { min-height: 44px; padding: 0 6px; border: 0; background: none; color: var(--gold); font-size: 14px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.eye { width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 10px; background: var(--berry); color: #FFFFFF; display: flex; align-items: center; justify-content: center; }
.collapse { width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 10px; background: none; color: var(--muted); display: flex; align-items: center; justify-content: center; }

.under { margin-left: 52px; display: flex; flex-direction: column; gap: 8px; }
.gift { background: var(--inset); border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.g-text { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.g-item { background: none; border: 0; padding: 2px 0; text-align: left; font-size: 15px; font-weight: 700; overflow-wrap: anywhere; border-radius: 6px; }
.g-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.g-sub .price { color: var(--ink); font-weight: 700; }
.g-sub .late { color: var(--gold); font-weight: 700; }
.g-sub .soon { color: var(--ordered-fg); font-weight: 600; }
.g-note { font-size: 13px; color: var(--soft); font-style: italic; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.addprice { background: none; border: 0; padding: 0; color: var(--pink); font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
.pill { min-height: 44px; padding: 0 12px; border: 0; border-radius: 999px; font-size: 13px; font-weight: 700; flex-shrink: 0; display: inline-flex; align-items: center; }
.st-idea { background: var(--idea-bg); color: var(--idea-fg); }
.st-ordered { background: var(--ordered-bg); color: var(--ordered-fg); }
.st-bought { background: var(--bought-bg); color: var(--bought-fg); }
.st-wrapped { background: var(--wrapped-bg); color: var(--wrapped-fg); }
.st-given { background: var(--given-bg); color: var(--given-fg); }
.addgift { min-height: 44px; border: 1px dashed var(--dash); border-radius: 10px; background: transparent; color: var(--ink); font-size: 14px; font-weight: 600; }
.none { font-size: 13px; color: var(--muted); margin: 0; }

.addperson { min-height: 52px; border: 2px dashed var(--dash); border-radius: 14px; background: transparent; color: var(--ink); font-size: 15px; font-weight: 700; }
.foot { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.foot-note { margin: 0; text-align: center; font-size: 13px; line-height: 1.5; color: var(--muted); }
.foot-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 16px; }
.lock { background: none; border: 0; min-height: 44px; padding: 0 4px; color: var(--muted); font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.banner { font-size: 13px; color: var(--gold); background: var(--given-bg); border-radius: 10px; padding: 8px 12px; text-align: center; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-family: var(--display); font-weight: 700; font-size: 20px; margin-bottom: 4px; }

/* Person pop-up card */
.pscrim { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, 0); transition: background .28s ease; }
.pscrim.in { background: var(--scrim); }
.pcard {
  width: 100%; max-width: 560px; height: 88%;
  background: var(--card); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0;
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.4);
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateY(100%); transition: transform .3s cubic-bezier(.2, .8, .2, 1);
}
.pscrim.in .pcard { transform: translateY(0); }
.pcard.dragging { transition: none; }

.pc-top { display: flex; align-items: center; gap: 6px; }

.iconbtn { width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: var(--inset); color: var(--soft); }

.pc-money b { color: var(--ink); font-size: 18px; }
.pc-money .over { color: var(--gold); font-weight: 700; }
.pc-money .setlink { font-size: 14px; min-height: 36px; }
.pc-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 8px; padding: 14px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }
.pc-body .addgift { margin-top: 4px; min-height: 48px; }
.nobudget { width: 100%; min-height: 48px; padding: 0 14px; border: 1.5px dashed var(--gold); border-radius: 12px; background: var(--given-bg); color: var(--gold); font-size: 15px; font-weight: 700; }
.nobudget span { text-decoration: underline; text-underline-offset: 3px; }
html.locked, html.locked body { overflow: hidden; }

/* Passcode screen */
.gate { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.gate .ring { width: 96px; height: 96px; align-self: center; background: repeating-linear-gradient(135deg, var(--berry) 0 8px, var(--ink) 8px 16px); }
.gate .ring-in { width: 78px; height: 78px; }
.gate .ring-n { font-size: 30px; }
.gate .ring-l { font-size: 10px; margin-top: 2px; }

.gate p { margin: 0; text-align: center; color: var(--muted); }
.gate form { display: flex; flex-direction: column; gap: 12px; }

/* Edit windows: pop-up cards that match the person card */
.scrim { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, 0); transition: background .28s ease; }
.scrim.in { background: var(--scrim); }
.sheet {
  width: 100%; max-width: 560px; max-height: 92%;
  background: var(--card); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0;
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.4);
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateY(100%); transition: transform .3s cubic-bezier(.2, .8, .2, 1);
}
.sheet:focus { outline: none; }
.scrim.in .sheet { transform: translateY(0); }
.sheet.dragging { transition: none; }
.sheet.stacked { max-height: 78%; }   /* opened from a person's card: let the card peek out above */
.ec-head { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 2px max(18px, env(safe-area-inset-right, 0px)) 8px max(18px, env(safe-area-inset-left, 0px)); }
.ec-head h3 { flex: 1; min-width: 0; margin: 0; font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.15; overflow-wrap: anywhere; }
.ec-body {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 14px;
  padding: 6px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
}
.discard {
  flex-shrink: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
  padding: 12px max(18px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  border-top: 1px solid var(--line); background: var(--inset);
}
.discard { justify-content: flex-end; }
.discard p { flex: 1 1 100%; margin: 0; font-weight: 700; color: var(--ink); }
.sheet h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 22px; }
.sheet p { margin: 0; color: var(--soft); font-size: 15px; }
.sheet p.small { font-size: 13px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }

<script>
/* ===== Your Supabase project (from Supabase > Connect). Both values are safe to publish. ===== */

  const SORTS = [

    const words = t.split(/\s+/).filter(Boolean);
    if (words.length > 1) return (words[0][0] + words[1][0]).toUpperCase();
    return t.length <= 2 ? t.toUpperCase() : t[0].toUpperCase();
  };
  function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function parseDay(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ""));
    return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : null;
  }
  const shortDay = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  function daysToChristmas() {
    const t = today();
    let x = new Date(t.getFullYear(), 11, 25);
    if (t > x) x = new Date(t.getFullYear() + 1, 11, 25);

  }
  function ringHtml(d) {

      <div class="ring-in"><span class="ring-n num ${d > 99 ? "long" : ""}">${d}</span><span class="ring-l">${d === 1 ? "DAY" : "DAYS"}</span></div></div>`;
  }

  /* ---------- server ---------- */
  async function rpc(fn, args) {
    let res;
    try {
      res = await fetch(`${BASE}/rest/v1/rpc/${fn}`, {

        <div class="field"><label for="g-code">Passcode</label>
          <input id="g-code" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"></div>
        <div class="err" id="g-err" aria-live="polite">${esc(msg)}</div>
        <button type="submit" class="btn primary wide">Open the list</button>
      </form></div>`;
    const form = document.getElementById("gate-form");
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const input = document.getElementById("g-code");
      const err = document.getElementById("g-err");
      const btn = form.querySelector("button");
      const code = input.value.trim();
      if (!code) { err.textContent = "Type the passcode first."; return; }
      btn.disabled = true; btn.textContent = "Opening…"; err.textContent = "";
      try {
        const d = await rpc("gift_list", { p_code: code });
        state.code = code; store.set("giftCode", code);
        state.lastJson = ""; applyData(d);
      } catch (x) {
        err.textContent = x.code === "passcode" ? "That passcode didn't work. Check it and try again."
          : x.code === "network" ? "Can't reach the list. Check your connection and try again."
          : "The list isn't responding right now. Try again in a minute.";
        btn.disabled = false; btn.textContent = "Open the list";
      }
    });
  }

  function personMeta(gs, spent, budget) {
    if (budget != null && spent > budget) return `<small class="over">· ${money(spent - budget)} over</small>`;
    if (!gs.length) return `<small>· no gifts yet</small>`;
    if (gs.length === 1) { const s = statusOf(gs[0]); return `<small>· ${s === "idea" ? "1 idea" : "1 " + s}</small>`; }
    return `<small>· ${plural(gs.length, "gift", "gifts")}</small>`;
  }

  function arrivalHtml(g) {
    if (statusOf(g) !== "ordered" || !g.expected) return "";
    const d = parseDay(g.expected);
    if (!d) return "";
    const diff = Math.round((d - today()) / 86400000);
    if (diff < 0) return `<span class="late">Late, was due ${esc(shortDay(d))}</span>`;
    if (diff === 0) return `<span class="soon">Arrives today</span>`;
    if (diff === 1) return `<span class="soon">Arrives tomorrow</span>`;
    return `<span>Arrives ${esc(shortDay(d))}</span>`;
  }

  function giftCard(g, forName) {
    const st = statusOf(g), gid = esc(g.id);
    const sub = [];
    if (forName) sub.push(`for ${esc(forName)}`);
    if (g.store) sub.push(esc(g.store));
    if (g.price != null) sub.push(`<span class="price num">${money(g.price)}</span>`);
    else sub.push(`<button class="addprice" data-act="edit-gift" data-id="${gid}" data-focus="price">add price</button>`);
    const arr = arrivalHtml(g); if (arr) sub.push(arr);
    const next = LABEL[STATUSES[(STATUSES.indexOf(st) + 1) % STATUSES.length]].toLowerCase();
    return `<div class="gift">
      <div class="g-text">
        <button class="g-item" data-act="edit-gift" data-id="${gid}">${esc(g.item || "Untitled gift")}</button>
        <span class="g-sub">${sub.join(" · ")}</span>
        ${g.notes ? `<span class="g-note">${esc(g.notes)}</span>` : ""}
      </div>
      <button class="pill st-${st}" data-act="cycle" data-id="${gid}" aria-label="${LABEL[st]}. Tap to mark ${next}">${LABEL[st]}</button>
    </div>`;
  }

  // Avatar colors follow the order people were added, so they don't change when the list is re-sorted.
  const colorsOf = people => Object.fromEntries(people.map((p, i) => [p.id, i % 4]));

  function sortPeople(people, gifts) {
    const list = people.slice();   // already in the order added
    if (state.sort === "kids") return list.sort((a, b) => (b.is_child ? 1 : 0) - (a.is_child ? 1 : 0));
    if (state.sort === "az") return list.sort((a, b) => String(a.name).localeCompare(String(b.name), undefined, { sensitivity: "base" }));
    if (state.sort === "far") {
      const left = p => p.budget == null ? -Infinity : p.budget - spentOf(gifts.filter(g => g.person_id === p.id));
      return list.sort((a, b) => { const la = left(a), lb = left(b); return la === lb ? 0 : lb > la ? 1 : -1; });
    }
    return list;
  }

  function personRows(people, gifts, colorOf) {
    if (!people.length) return `<div class="empty"><strong>No one on the list yet</strong>Add the first person below, then add their gifts.</div>`;
    return people.map(p => {
      const gs = gifts.filter(g => g.person_id === p.id);
      const spent = spentOf(gs);
      const budget = p.budget;
      const over = budget != null && spent > budget;
      const id = esc(p.id), name = esc(p.name);
      const bar = budget != null && budget > 0
        ? `<span class="thin" aria-hidden="true"><span class="${over ? "over" : ""}" style="width:${Math.min(100, spent / budget * 100).toFixed(1)}%"></span></span>` : "";
      return `<div class="row prow">
        <button class="prow-hit" data-act="person" data-id="${id}" aria-label="Open ${name}'s gifts"></button>
        <span class="avatar av-${colorOf[p.id]}" aria-hidden="true">${esc(initials(p.name))}</span>
        <span class="who"><span class="who-name">${name}${p.is_child ? STAR : ""} ${personMeta(gs, spent, budget)}</span>${bar}</span>
        ${budget != null
          ? `<span class="amt num ${over ? "over" : ""}">${money(spent)}<small> / ${money(budget)}</small></span>`
          : `${spent > 0 ? `<span class="amt num">${money(spent)}</span>` : ""}<button class="budget-pill" data-act="set-budget" data-id="${id}" aria-label="Set a budget for ${name}">Set budget</button>`}
        <span class="go" aria-hidden="true">${GO}</span>
      </div>`;
    }).join("");
  }

  function statusRows(gifts, byId) {
    return STATUSES.map(s => {
      const gs = gifts.filter(g => statusOf(g) === s);
      const key = "s:" + s;
      const open = revealed.has(key);
      const total = gs.reduce((a, g) => a + (g.price != null ? g.price : 0), 0);
      return `<div class="row ${open ? "open" : ""}">
        <div class="row-top">
          <span class="av-st st-${s}" aria-hidden="true"><i style="background:${SEG[s]}"></i></span>
          <div class="who"><span class="who-name">${LABEL[s]} <small>· ${plural(gs.length, "gift", "gifts")}</small></span></div>
          <div class="amt num">${money(total)}</div>
          ${gs.length ? (open
            ? `<button class="collapse" data-act="toggle" data-key="${key}" aria-expanded="true" aria-label="Hide ${LABEL[s].toLowerCase()} gifts">${UP}</button>`
            : `<button class="eye" data-act="toggle" data-key="${key}" aria-expanded="false" aria-label="Peek at ${LABEL[s].toLowerCase()} gifts">${EYE}</button>`)
            : `<span class="collapse" aria-hidden="true"></span>`}
        </div>
        ${open && gs.length ? `<div class="under">${gs.map(g => giftCard(g, byId[g.person_id] && byId[g.person_id].name)).join("")}</div>` : ""}
      </div>`;
    }).join("");
  }

  function kidsCard(people, gifts) {
    const kids = people.filter(p => p.is_child);
    if (!kids.length) return "";
    const rows = kids.map(k => {
      const gs = gifts.filter(g => g.person_id === k.id);
      return { k, n: gs.length, spent: spentOf(gs) };
    });
    const max = Math.max(...rows.map(r => r.spent), 0);
    const min = Math.min(...rows.map(r => r.spent));
    let gap = "";
    if (rows.length > 1 && max > 0) {
      const low = rows.filter(r => r.spent === min).map(r => esc(r.k.name));
      const top = esc(rows.find(r => r.spent === max).k.name);
      gap = max - min < 0.005 ? "All even so far" : `${low.join(" and ")} ${low.length > 1 ? "are" : "is"} ${money(max - min)} behind ${top}`;
    }
    const summary = max <= 0 ? "Nothing spent yet" : rows.length === 1 ? `${esc(rows[0].k.name)} ${money(rows[0].spent)}` : gap;
    const open = state.kidsOpen;
    return `<section class="card kids" aria-label="Kids side by side">
      <button class="kids-h" data-act="kids" aria-expanded="${open}" aria-controls="kids-rows">
        <span class="kids-t"><span class="kids-name">Kids</span>${open ? `<span class="kids-sub">spent so far</span>` : `<span class="kids-sum num">· ${summary}</span>`}</span>
        <span class="chev" aria-hidden="true">${open ? UP : DOWN}</span>
      </button>
      ${open ? `<div class="kids-rows" id="kids-rows">
        ${rows.map(r => `<div class="kid-row">
          <span class="kid-name">${esc(r.k.name)} <small>· ${plural(r.n, "gift", "gifts")}</small></span>
          <span class="kid-amt num">${money(r.spent)}</span>
          <div class="kid-bar" aria-hidden="true"><span style="width:${max > 0 ? (r.spent / max * 100).toFixed(1) : 0}%"></span></div>
        </div>`).join("")}
        ${gap ? `<p class="kids-note">${gap}.</p>` : ""}
      </div>` : ""}
    </section>`;
  }

  function render() {
    if (!CONFIGURED) return renderSetup();
    if (!state.code) return renderGate("");
    if (!state.data) {
      mini.classList.remove("on");
      fab.hidden = true;
      app.innerHTML = `<div class="gate">${ringHtml(daysToChristmas())}<p>${state.offline ? "Can't reach the list. Check your connection; it will retry on its own." : "Loading the list…"}</p></div>`;
      return;
    }
    const { people, gifts: allGifts } = state.data;
    const byId = Object.fromEntries(people.map(p => [p.id, p]));
    const gifts = allGifts.filter(g => byId[g.person_id]);
    const spent = spentOf(gifts);
    // The overall budget is the total of everyone's own budgets.
    const withBudget = people.filter(p => p.budget != null);
    const budget = withBudget.length ? Math.round(withBudget.reduce((a, p) => a + p.budget, 0) * 100) / 100 : null;
    const noBudget = people.length - withBudget.length;
    const over = budget != null && spent > budget;
    const n = {}; STATUSES.forEach(s => n[s] = 0);
    gifts.forEach(g => n[statusOf(g)]++);
    const colorOf = colorsOf(people);
    const sortLabel = (SORTS.find(s => s[0] === state.sort) || SORTS[0])[1];

    const budgetStat = `<button class="stat stat-btn" data-act="budget-info" aria-label="Budget ${budget == null ? "not set" : money(budget)}. It's the total of everyone's budgets${noBudget && people.length ? `; ${plural(noBudget, "person doesn't", "people don't")} have one yet` : ""}.">
        <span class="stat-l">Budget</span>
        <span class="stat-v num">${budget == null ? "—" : big(budget)}</span>
        ${noBudget && people.length ? `<span class="stat-note">+ ${noBudget} without a budget</span>` : ""}
      </button>`;
    const syncedTime = state.syncedAt ? new Date(state.syncedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";

    app.innerHTML = `
      <header class="head"><h1>Christmas Gift List</h1>
        <div class="head-r">
          <button class="privbtn" data-act="privacy" aria-pressed="${state.priv}" aria-label="${state.priv ? "Show amounts and gifts" : "Hide amounts and gifts"}">${state.priv ? EYE_OFF : EYE}</button>
          ${ringHtml(daysToChristmas())}
        </div>
      </header>
      ${state.offline ? `<div class="banner" role="status">Offline. Showing the list as of ${esc(syncedTime)}. Changes need a connection.</div>` : ""}
      <section class="card stats" aria-label="Spending summary">
        <div class="stat-grid">
          <div class="stat"><span class="stat-l">Spent</span><span class="stat-v num pink">${big(spent)}</span></div>
          <div class="stat"><span class="stat-l">${over ? "Over" : "Left"}</span><span class="stat-v num ${over ? "gold" : ""}">${budget == null ? "—" : big(Math.abs(budget - spent))}</span></div>
          ${budgetStat}
        </div>
        ${budget != null && budget > 0 ? `<div class="cane" role="img" aria-label="${money(spent)} of ${money(budget)} spent"><span class="${over ? "over" : ""}" style="width:${Math.min(100, spent / budget * 100).toFixed(1)}%"></span></div>` : ""}
        <div class="mix">
          <div class="mix-bar" role="img" aria-label="Gifts by status">${STATUSES.filter(s => n[s]).map(s => `<span style="flex:${n[s]};background:${SEG[s]}"></span>`).join("")}</div>
          <div class="mix-legend num">${STATUSES.map(s => `<span class="c-${s}">${LABEL[s]} ${n[s]}</span>`).join("")}</div>
        </div>
      </section>
      ${kidsCard(people, gifts)}
      <div class="switch" role="group" aria-label="Group gifts by">
        <button data-act="view" data-view="person" aria-pressed="${state.view === "person"}">By person</button>
        <button data-act="view" data-view="status" aria-pressed="${state.view === "status"}">By status</button>
      </div>
      ${state.view === "person" && people.length > 1 ? `<div class="sortbar"><span>${plural(people.length, "person", "people")}</span>
        <button class="sortbtn" data-act="sort" aria-label="Sort people. Now: ${sortLabel}">Sort: ${sortLabel} ${DOWN}</button></div>` : ""}
      <section class="card list" aria-label="${state.view === "person" ? "Gifts by person" : "Gifts by status"}">
        ${state.view === "person" ? personRows(sortPeople(people, gifts), gifts, colorOf) : statusRows(gifts, byId)}
      </section>
      <button class="addperson" data-act="add-person">+ Add a person</button>
      <div class="foot">
        <p class="foot-note">Tap a name to see their gifts. Tap a gift to edit it.<br>Tap a status to move it along: Idea → Ordered → Bought → Wrapped → Given.</p>
        <div class="foot-actions">
          <button class="lock" data-act="export">Export a backup</button>
          <button class="lock" data-act="restore">Restore from a backup</button>
          <button class="lock" data-act="new-year">Start a new year</button>
          <button class="lock" data-act="lock">Lock on this phone</button>
        </div>
      </div>`;
    fab.hidden = false;
    renderMini(spent, budget, over);
    if (openPerson) fillPersonCard();
    requestAnimationFrame(updateMini);
  }

  /* ---------- interactions ---------- */
  function onAct(e) {
    const b = e.target.closest("[data-act]");
    if (!b || b.disabled || !state.data) return;
    const id = b.dataset.id;
    switch (b.dataset.act) {
      case "toggle": {
        const key = b.dataset.key;
        revealed.has(key) ? revealed.delete(key) : revealed.add(key);
        render();
        const t = app.querySelector(`[data-act="toggle"][data-key="${CSS.escape(key)}"]`); if (t) t.focus();
        break;
      }
      case "view":
        state.view = b.dataset.view; store.set("giftView", state.view); render();
        { const t = app.querySelector(`[data-view="${state.view}"]`); if (t) t.focus(); }
        break;
      case "cycle": cycle(id); break;
      case "edit-gift": { const g = state.data.gifts.find(x => x.id === id); if (g) giftSheet(g.person_id, g, b.dataset.focus); break; }
      case "add-gift": giftSheet(id, null); break;
      case "edit-person": personSheet(id); break;
      case "set-budget": personSheet(id, "budget"); break;
      case "add-person": personSheet(null); break;
      case "budget-info": toast("Budget is the total of everyone's budgets. Set them on each person."); break;
      case "privacy":
        state.priv = !state.priv;
        document.documentElement.classList.toggle("private", state.priv);
        render();
        { const t = app.querySelector('[data-act="privacy"]'); if (t) t.focus({ preventScroll: true }); }
        break;
      case "sort": sortSheet(); break;
      case "new-year": newYearSheet(); break;
      case "lock": lock(""); break;
      case "export": exportBackup(); break;
      case "restore": restoreSheet(); break;
      case "person": openPersonCard(id); break;
      case "close-person": closePersonCard(); break;
      case "kids":
        state.kidsOpen = !state.kidsOpen;
        store.set("giftKidsOpen", state.kidsOpen ? "1" : "0");
        render();
        { const t = app.querySelector('[data-act="kids"]'); if (t) t.focus({ preventScroll: true }); }
        break;
    }
  }
  app.addEventListener("click", onAct);
  fab.addEventListener("click", () => { if (state.data) giftSheet(null, null); });
  pscrim.addEventListener("click", e => { if (e.target === pscrim) { closePersonCard(); return; } onAct(e); });

  async function cycle(id) {
    if (busy.has(id)) return;
    const g = state.data.gifts.find(x => x.id === id);
    if (!g) return;
    const from = statusOf(g);
    const next = STATUSES[(STATUSES.indexOf(from) + 1) % STATUSES.length];
    busy.add(id);
    if (state.view === "status" && revealed.has("s:" + from)) revealed.add("s:" + next);
    g.status = next;
    state.lastJson = ""; render();   // show it right away; the next server read replaces it either way
    const ok = await act("gift_set_status", { p_id: id, p_status: next, p_bought_by: null });
    busy.delete(id);
    if (ok) offerUndo(`Marked ${LABEL[next]}`, () => act("gift_set_status", { p_id: id, p_status: from, p_bought_by: null }));
  }

  /* ---------- person pop-up card ---------- */
  const reduceMotion = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (_) { return false; } };

  function openPersonCard(id) {
    if (!state.data || !state.data.people.some(p => p.id === id)) return;
    openPerson = id;
    pLastFocus = document.activeElement;
    pscrim.classList.remove("in");
    pscrim.innerHTML = `<section class="pcard" role="dialog" aria-modal="true" aria-labelledby="pc-title">
      <div class="grab" aria-hidden="true"><span></span></div>
      <div class="pc-head" id="pc-head"></div>
      <div class="pc-body" id="pc-body"></div>
    </section>`;
    pscrim.hidden = false;
    document.documentElement.classList.add("locked");
    fillPersonCard();
    const sheet = pscrim.querySelector(".pcard");
    void sheet.offsetHeight;          // start the slide-up from below the screen
    pscrim.classList.add("in");
    bindSwipe(sheet, sheet.querySelector(".pc-body"), () => { closePersonCard(); return true; });
    const x = pscrim.querySelector('[data-act="close-person"]');
    if (x) x.focus({ preventScroll: true });
  }

  function closePersonCard(instant) {
    if (!openPerson) return;
    const id = openPerson;
    openPerson = null;
    const sheet = pscrim.querySelector(".pcard");
    pscrim.classList.remove("in");
    if (sheet) { sheet.classList.remove("dragging"); sheet.style.transform = "translateY(100%)"; }
    const done = () => {
      if (openPerson) return;      // another card opened in the meantime
      pscrim.hidden = true; pscrim.innerHTML = "";
      document.documentElement.classList.remove("locked");
    };
    if (instant || reduceMotion()) done(); else setTimeout(done, 300);
    if (!instant) {
      const back = (pLastFocus && document.contains(pLastFocus)) ? pLastFocus
        : app.querySelector(`[data-act="person"][data-id="${CSS.escape(id)}"]`);
      if (back) back.focus({ preventScroll: true });
    }
  }

  function fillPersonCard() {
    const p = state.data && state.data.people.find(x => x.id === openPerson);
    if (!p) { closePersonCard(true); return; }
    const head = document.getElementById("pc-head"), body = document.getElementById("pc-body");
    if (!head || !body) return;
    const gs = state.data.gifts.filter(g => g.person_id === p.id);
    const spent = spentOf(gs), budget = p.budget, over = budget != null && spent > budget;
    const id = esc(p.id), name = esc(p.name);
    const line = budget != null
      ? `<span><b>${money(spent)}</b> of ${money(budget)}</span><span>·</span>${over ? `<span class="over">${money(spent - budget)} over</span>` : `<span>${money(budget - spent)} left</span>`}`
      : `<span><b>${money(spent)}</b> spent</span>`;
    head.innerHTML = `
      <div class="pc-top">
        <h3 id="pc-title">${name}${p.is_child ? STAR : ""}</h3>
        <button class="iconbtn" data-act="edit-person" data-id="${id}" aria-label="Edit ${name}">${PENCIL_L}</button>
        <button class="iconbtn" data-act="close-person" aria-label="Close">${XICON}</button>
      </div>
      <div class="pc-money num">${line}<span>·</span><span>${plural(gs.length, "gift", "gifts")}</span></div>
      ${budget == null
        ? `<button class="nobudget" data-act="set-budget" data-id="${id}">No budget yet · <span>Set budget</span></button>`
        : budget > 0 ? `<div class="cane" role="img" aria-label="${money(spent)} of ${money(budget)} spent"><span class="${over ? "over" : ""}" style="width:${Math.min(100, spent / budget * 100).toFixed(1)}%"></span></div>` : ""}`;
    const top = body.scrollTop;
    body.innerHTML = `${gs.length ? gs.map(g => giftCard(g)).join("") : `<p class="none">No gifts yet.</p>`}
      <button class="addgift" data-act="add-gift" data-id="${id}">+ Add a gift for ${name}</button>`;
    body.scrollTop = top;
  }

  // Swipe the card down to close it: from the top area, or from the list when it's scrolled to the top.
  // Shared by the person card and every edit window. onClose returns false when the close was
  // held back (unsaved changes), and the card springs back into place.
  function bindSwipe(sheet, body, onClose) {
    let y0 = null, dy = 0, dragging = false, t0 = 0;
    sheet.addEventListener("touchstart", e => {
      if (e.touches.length !== 1) { y0 = null; return; }
      if (body.contains(e.target) && body.scrollTop > 0) { y0 = null; return; }
      y0 = e.touches[0].clientY; dy = 0; dragging = false; t0 = Date.now();
    }, { passive: true });
    sheet.addEventListener("touchmove", e => {
      if (y0 == null) return;
      const d = e.touches[0].clientY - y0;
      if (!dragging) {
        if (d > 8) { dragging = true; sheet.classList.add("dragging"); }
        else if (d < -4) { y0 = null; return; }   // they're scrolling the list up, not dragging
        else return;
      }
      dy = Math.max(0, d);
      sheet.style.transform = `translateY(${dy}px)`;
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
    const end = () => {
      if (y0 == null) return;
      y0 = null;
      if (!dragging) return;
      dragging = false;
      sheet.classList.remove("dragging");
      const flick = dy > 50 && Date.now() - t0 < 250;
      if ((dy > 120 || flick) && onClose() !== false) return;
      sheet.style.transform = "";
    };
    sheet.addEventListener("touchend", end);
    sheet.addEventListener("touchcancel", end);
  }

  /* ---------- slim bar pinned to the top ---------- */
  function renderMini(spent, budget, over) {
    const d = daysToChristmas();
    const left = budget == null ? "—" : big(Math.abs(budget - spent));
    const label = `Spent ${money(spent)}${budget != null ? `, ${over ? "over by" : "left"} ${money(Math.abs(budget - spent))}, budget ${money(budget)}` : ""}, ${plural(d, "day", "days")} to Christmas. Back to top`;
    mini.innerHTML = `<button class="mini-in" type="button" aria-label="${esc(label)}">
      <span class="mini-grid" aria-hidden="true">
        <span class="m"><span class="ml">Spent</span><span class="mv num pink">${big(spent)}</span></span>
        <span class="m"><span class="ml">${over ? "Over" : "Left"}</span><span class="mv num ${over ? "gold" : ""}">${left}</span></span>
        <span class="m"><span class="ml">Budget</span><span class="mv num">${budget == null ? "—" : big(budget)}</span></span>
        <span class="m days"><span class="ml">Days</span><span class="mv num">${d}</span></span>
      </span>
      ${budget != null && budget > 0 ? `<span class="cane" aria-hidden="true"><span class="${over ? "over" : ""}" style="width:${Math.min(100, spent / budget * 100).toFixed(1)}%"></span></span>` : ""}
    </button>`;
  }
  function updateMini() {
    const g = state.data && state.code ? app.querySelector(".stat-grid") : null;
    mini.classList.toggle("on", !!g && g.getBoundingClientRect().bottom < 4);
  }
  let ticking = false;
  window.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; updateMini(); });
  }, { passive: true });
  mini.addEventListener("click", () => window.scrollTo({ top: 0, behavior: reduceMotion() ? "auto" : "smooth" }));

  /* ---------- edit windows ---------- */
  // Each edit window is a pop-up card like the person card: grab handle, ✕, slides up and down,
  // closes with a swipe down, the ✕ or a tap outside. If anything was changed and not saved,
  // closing asks "Discard changes?" first.
  let lastFocus = null, sheetSnap = "", sheetToken = 0;
  const formState = form => JSON.stringify([...form.elements]
    .filter(el => (el.id || el.name) && !["file", "button", "submit"].includes(el.type))
    .map(el => (el.type === "checkbox" || el.type === "radio") ? el.checked : el.value));

  // focus: a selector for the box that should get the keyboard, or null for no keyboard
  function openSheet({ label, title, body, onSubmit, onReady, focus }) {
    sheetToken++;
    const swapping = !scrim.hidden && scrim.classList.contains("in");   // one window replacing another, e.g. picker → gift
    if (!swapping) lastFocus = document.activeElement;
    if (!swapping) scrim.classList.remove("in");
    scrim.innerHTML = `<form class="sheet${openPerson ? " stacked" : ""}" role="dialog" aria-modal="true" aria-label="${esc(label)}" novalidate tabindex="-1">
      <div class="grab" aria-hidden="true"><span></span></div>
      <div class="ec-head"><h3>${title}</h3><button type="button" class="iconbtn" data-close aria-label="Close">${XICON}</button></div>
      <div class="ec-body">${body}</div>
      <div class="discard" hidden>
        <p>Discard changes?</p>
        <button type="button" class="btn" data-keep>Keep editing</button>
        <button type="button" class="btn danger armed" data-discard>Discard</button>
      </div>
    </form>`;
    scrim.hidden = false;
    const form = scrim.querySelector("form");
    form.addEventListener("submit", async ev => {
      ev.preventDefault();
      const save = form.querySelector('[type="submit"]');
      if (!save || save.disabled || !onSubmit) return;
      save.disabled = true;
      const ok = await onSubmit(form);
      save.disabled = false;
      if (ok) closeSheet();
    });
    form.querySelector("[data-close]").addEventListener("click", requestCloseSheet);
    form.querySelector("[data-keep]").addEventListener("click", () => {
      form.querySelector(".discard").hidden = true;
      form.focus({ preventScroll: true });
    });
    form.querySelector("[data-discard]").addEventListener("click", () => closeSheet());
    if (onReady) onReady(form);
    sheetSnap = formState(form);
    const target = focus ? form.querySelector(focus) : null;
    if (target) target.focus({ preventScroll: true }); else form.focus({ preventScroll: true });
    void form.offsetHeight;           // start the slide-up from below the screen
    scrim.classList.add("in");
    bindSwipe(form, form.querySelector(".ec-body"), requestCloseSheet);
  }

  // Close if nothing changed; otherwise show "Discard changes?" and keep the window open.
  function requestCloseSheet() {
    const form = scrim.querySelector("form");
    if (!form || scrim.hidden) return true;
    if (formState(form) !== sheetSnap) {
      const bar = form.querySelector(".discard");
      bar.hidden = false;
      bar.querySelector("[data-keep]").focus({ preventScroll: true });
      return false;
    }
    closeSheet();
    return true;
  }

  function closeSheet(instant) {
    if (!forpanel.hidden) closeForPanel();
    if (scrim.hidden) return;
    const token = ++sheetToken;
    const form = scrim.querySelector("form");
    scrim.classList.remove("in");
    if (form) { form.classList.remove("dragging"); form.style.transform = "translateY(100%)"; }
    const done = () => { if (token !== sheetToken) return; scrim.hidden = true; scrim.innerHTML = ""; };
    if (instant || reduceMotion()) done(); else setTimeout(done, 300);
    if (!instant && lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }
  scrim.addEventListener("click", e => { if (e.target === scrim) requestCloseSheet(); });
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (!forpanel.hidden) closeForPanel();     // the For search panel sits above everything
    else if (!scrim.hidden) requestCloseSheet();   // the edit window sits on top, so it goes first
    else if (openPerson) closePersonCard();
  });

  function armButton(btn, label, action) {
    let armed = false;
    const original = btn.textContent;
    btn.addEventListener("click", async () => {
      if (btn.disabled) return;
      if (!armed) { armed = true; btn.classList.add("armed"); btn.textContent = label; return; }
      btn.disabled = true;
      const ok = await action();
      if (ok) closeSheet(); else btn.disabled = false;
    });
    return () => { armed = false; btn.classList.remove("armed"); btn.textContent = original; };
  }
  const showErr = (form, msg) => { form.querySelector(".err").textContent = msg; };
  const actions = (del, saveLabel) => `<div class="err" aria-live="polite"></div>
    <div class="row-actions">${del}<div class="right"><button type="submit" class="btn primary">${saveLabel}</button></div></div>`;
  const segHtml = (name, opts, picked, cols) => `<div class="seg${cols === "flow" ? " flow" : ""}" role="radiogroup" style="--cols:${cols === "flow" ? 4 : cols}">
    ${opts.map(o => `<input type="radio" name="${name}" id="f-${name}-${o.v}" value="${o.v}" ${String(o.v) === String(picked) ? "checked" : ""}><label for="f-${name}-${o.v}" class="${o.cls}">${esc(o.label)}</label>`).join("")}
  </div>`;
  const picked = (form, name) => (form.querySelector(`input[name="${name}"]:checked`) || {}).value;

  // thenGift: after adding a new person, go straight to adding a gift for them (from the 🎁 button)
  function personSheet(id, focus, thenGift) {
    const p = id ? state.data.people.find(x => x.id === id) : null;
    const n = p ? state.data.gifts.filter(g => g.person_id === p.id).length : 0;
    openSheet({
      label: p ? "Edit person" : "Add a person",
      title: p ? "Edit " + esc(p.name) : "Add a person",
      body: `<div class="field"><label for="f-name">Name</label>
          <input id="f-name" type="text" autocomplete="off" autocapitalize="words" value="${esc(p ? p.name : "")}" placeholder="e.g. Grandpa"></div>
        <div class="field"><label for="f-budget">Budget for them (optional)</label>
          <input id="f-budget" inputmode="decimal" placeholder="$0" value="${p && p.budget != null ? p.budget : ""}"></div>
        <label class="check"><input type="checkbox" id="f-kid" ${p && p.is_child ? "checked" : ""}> One of our kids ⭐</label>
        ${actions(p ? `<button type="button" class="btn danger" id="f-del">Remove</button>` : "", p ? "Save" : "Add person")}`,
      // New person: type the name. "Set budget": type the budget. Editing: no keyboard.
      focus: !p ? "#f-name" : focus === "budget" ? "#f-budget" : null,
      onSubmit: async form => {
        const name = form.querySelector("#f-name").value.trim();
        const budget = parseMoney(form.querySelector("#f-budget").value);
        const kid = form.querySelector("#f-kid").checked;
        if (!name) { showErr(form, "Add a name."); return false; }
        if (name.length > 80) { showErr(form, "Keep the name under 80 characters."); return false; }
        if (Number.isNaN(budget)) { showErr(form, "Enter the budget as a dollar amount, like 75."); return false; }
        const r = await send("gift_save_person", { p_id: p ? p.id : null, p_name: name, p_budget: budget, p_is_child: kid });
        if (!r.ok) return false;
        await refresh();
        if (!p && thenGift && r.value) setTimeout(() => giftSheet(r.value, null), 0);   // opens right after this window closes
        return true;
      },
      onReady: form => {
        const del = form.querySelector("#f-del");
        if (del) armButton(del, n ? `Remove ${p.name} and ${plural(n, "gift", "gifts")}?` : `Remove ${p.name}?`, async () => {
          const person = { name: p.name, budget: p.budget, is_child: p.is_child };
          const theirGifts = state.data.gifts.filter(g => g.person_id === p.id).map(g => Object.assign({}, g));
          revealed.delete("p:" + p.id);
          const ok = await act("gift_delete_person", { p_id: p.id });
          if (ok) offerUndo(`Removed ${person.name}`, async () => {
            const r = await send("gift_save_person", { p_id: null, p_name: person.name, p_budget: person.budget, p_is_child: person.is_child });
            if (!r.ok) return false;
            for (const g of theirGifts) {
              const r2 = await send("gift_save_gift", Object.assign({ p_id: null }, giftArgs(g, r.value)));
              if (!r2.ok) break;
            }
            await refresh();
            return true;
          });
          return ok;
        });
      }
    });
  }

  function sortSheet() {
    openSheet({
      label: "Sort people",
      title: "Sort people by",
      focus: null,
      onSubmit: null,
      body: `<div class="optlist">${SORTS.map(([v, l, d]) => `<button type="button" class="opt" data-sort="${v}" aria-pressed="${state.sort === v}">${l}<small>${d}</small></button>`).join("")}</div>`,
      onReady: form => form.querySelectorAll("[data-sort]").forEach(btn => btn.addEventListener("click", () => {

        closeSheet();
      }))
    });

  // Start a new year: save a backup file first, then clear every gift. People, kids and budgets stay.
  function newYearSheet() {
    const n = state.data.gifts.length;
    let saved = false;
    openSheet({
      label: "Start a new year",
      title: "Start a new year",
      focus: null,
      onSubmit: null,
      body: n === 0
        ? `<p>There aren't any gifts on the list, so there's nothing to clear.</p>`
        : `<p>This clears all ${plural(n, "gift", "gifts")} so you can start fresh. Everyone on the list stays, along with ⭐ kids and their budgets.</p>
          <div class="steps">
            <button type="button" class="btn primary wide" id="ny-save">1. Save a backup of this year</button>
            <button type="button" class="btn danger wide" id="ny-clear" disabled>2. Clear all gifts</button>
          </div>
          <p class="small">The clear button turns on once the backup is saved. To bring this year's gifts back later, use Restore from a backup with that file.</p>
          <div class="err" aria-live="polite"></div>`,
      onReady: form => {
        const saveBtn = form.querySelector("#ny-save"), clearBtn = form.querySelector("#ny-clear");
        if (!saveBtn) return;
        saveBtn.addEventListener("click", async () => {
          if (await exportBackup()) {
            saved = true;
            saveBtn.textContent = "✓ Backup saved";
            saveBtn.classList.remove("primary");

          }
        });
        armButton(clearBtn, "Tap again to clear all gifts", async () => {
          if (!saved) return false;
          const ids = state.data.gifts.map(g => g.id);
          for (let i = 0; i < ids.length; i++) {
            clearBtn.textContent = `Clearing ${i + 1} of ${ids.length}…`;
            const r = await send("gift_delete_gift", { p_id: ids[i] });
            if (!r.ok) { await refresh(); showErr(form, "Some gifts weren't cleared. Check your connection and try again."); return false; }

  // The "For" search panel: pinned to the top of the screen with the matches under it, so the
  // keyboard never pushes it out of view. Type a few letters, tap a match, or "+ New person".
  const fpQ = document.getElementById("fp-q"), fpList = document.getElementById("fp-list"), fpBox = forpanel.querySelector(".fp-box");
  let fpCtx = null, fpOptions = [], fpActive = 0;

  function placeForPanel() {
    // Keep the panel at the top of what's actually visible, even if iOS shifts the page for the keyboard.
    const vv = window.visualViewport;
    fpBox.style.transform = vv && vv.offsetTop ? `translateY(${vv.offsetTop}px)` : "";
  }
  function openForPanel(ctx) {
    fpCtx = ctx;
    fpQ.value = "";
    forpanel.hidden = false;
    fpQ.focus({ preventScroll: true });   // right in the tap, so the keyboard opens
    renderForPanel();
    placeForPanel();
    if (window.visualViewport) {
      visualViewport.addEventListener("resize", placeForPanel);
      visualViewport.addEventListener("scroll", placeForPanel);
    }
  }
  function closeForPanel() {
    if (forpanel.hidden) return;
    forpanel.hidden = true;
    fpCtx = null;
    fpQ.blur();
    if (window.visualViewport) {
      visualViewport.removeEventListener("resize", placeForPanel);
      visualViewport.removeEventListener("scroll", placeForPanel);
    }
  }
  function renderForPanel() {
    if (!fpCtx) return;
    const text = fpQ.value.trim(), t = text.toLowerCase();
    const found = !t ? [] : fpCtx.people.filter(p => {
      const n = String(p.name).toLowerCase();
      return n.startsWith(t) || n.split(/\s+/).some(w => w.startsWith(t));
    }).slice(0, 6);
    const exact = found.some(p => String(p.name).toLowerCase() === t);
    const count = id => state.data.gifts.filter(g => g.person_id === id).length;
    fpOptions = found.map(p => ({ id: p.id }));
    let html = !t ? `<p class="fornone">Start typing to find someone.</p>`
      : !found.length ? `<p class="fornone">No one called “${esc(text)}” yet.</p>` : "";
    html += found.map((p, i) => `<button type="button" class="foropt" role="option" data-i="${i}">${esc(p.name)}${p.is_child ? STAR : ""} <small>· ${plural(count(p.id), "gift", "gifts")}</small></button>`).join("");
    if (!exact) {
      fpOptions.push({ id: "new" });
      html += `<button type="button" class="foropt new" role="option" data-i="${fpOptions.length - 1}">+ New person${text ? `: “${esc(text)}”` : ""}</button>`;
    }
    fpActive = 0;
    fpList.innerHTML = html;
    fpList.querySelectorAll(".foropt").forEach((b, i) => b.classList.toggle("active", i === 0 && !!t));
  }
  function chooseFor(opt) {
    const ctx = fpCtx, text = fpQ.value.trim();
    closeForPanel();
    if (ctx) ctx.onChoose(opt, text);
  }
  fpQ.addEventListener("input", renderForPanel);
  fpQ.addEventListener("keydown", e => {
    if (!fpOptions.length) return;
    const moveTo = i => { fpActive = i; fpList.querySelectorAll(".foropt").forEach((b, k) => b.classList.toggle("active", k === fpActive)); };
    if (e.key === "ArrowDown") { moveTo(Math.min(fpActive + 1, fpOptions.length - 1)); e.preventDefault(); }
    else if (e.key === "ArrowUp") { moveTo(Math.max(fpActive - 1, 0)); e.preventDefault(); }
    else if (e.key === "Enter") { e.preventDefault(); if (fpQ.value.trim()) chooseFor(fpOptions[fpActive]); }
  });
  fpList.addEventListener("mousedown", e => e.preventDefault());   // keep the keyboard up while tapping a match
  fpList.addEventListener("click", e => { const b = e.target.closest(".foropt"); if (b) chooseFor(fpOptions[Number(b.dataset.i)]); });
  document.getElementById("fp-cancel").addEventListener("click", closeForPanel);
  forpanel.addEventListener("click", e => { if (e.target === forpanel) closeForPanel(); });

  // Wires the For row on a new gift (from the 🎁 button) to the search panel.
  function bindForSearch(form, people) {
    const btn = form.querySelector("#f-for-btn"), idBox = form.querySelector("#f-for-id"), pickEl = form.querySelector("#f-for-pick");
    const newWrap = form.querySelector("#f-new-wrap"), newName = form.querySelector("#f-newname");
    const open = () => openForPanel({
      people,
      onChoose: (opt, text) => {
        showErr(form, "");
        if (opt.id === "new") {
          idBox.value = "new";
          newName.value = text;
          pickEl.innerHTML = `<span>+ New person</span><button type="button" data-change>Change</button>`;
          newWrap.hidden = false;
          if (!text) newName.focus({ preventScroll: true });
        } else {
          const p = state.data.people.find(x => x.id === opt.id);
          idBox.value = opt.id;
          pickEl.innerHTML = `<span>${esc(p ? p.name : "")}${p && p.is_child ? STAR : ""}</span><button type="button" data-change>Change</button>`;
          newWrap.hidden = true;
        }
        btn.hidden = true;
        pickEl.hidden = false;
        form.querySelector("#f-for-wrap").scrollIntoView({ block: "nearest" });
      }
    });
    btn.addEventListener("click", open);
    pickEl.addEventListener("click", e => { if (e.target.closest("[data-change]")) open(); });
  }

  // personId null (from the 🎁 button): gift first, then pick who it's for at the bottom.
  function giftSheet(personId, g, focus) {
    const pick = !personId && !g;
    const p = pick ? null : state.data.people.find(x => x.id === personId);
    if (!pick && !p) return;
    const st = g ? statusOf(g) : "idea";
    const order = pick ? state.data.people.filter(x => x.is_child).concat(state.data.people.filter(x => !x.is_child)) : [];
    const forRow = !pick ? "" : `<div class="field" id="f-for-wrap"><span class="lbl" id="f-for-lbl">For</span>
        <input type="hidden" id="f-for-id" value="">
        <button type="button" class="forbtn" id="f-for-btn" aria-labelledby="f-for-lbl f-for-btn"><span>Who's it for?</span>${SEARCH}</button>
        <div class="forpick" id="f-for-pick" hidden></div>
        <div class="newperson" id="f-new-wrap" hidden>
          <label for="f-newname">New person's name</label>
          <input id="f-newname" type="text" autocomplete="off" autocapitalize="words" placeholder="e.g. Grandpa">
          <label class="check"><input type="checkbox" id="f-newkid"> One of our kids ⭐</label>
        </div>
      </div>`;
    openSheet({
      label: g ? "Edit gift" : "New gift",
      title: pick ? "New gift" : (g ? "Edit gift for " : "New gift for ") + esc(p.name),
      body: `<div class="field"><label for="f-item">Gift</label>
          <input id="f-item" type="text" autocomplete="off" value="${esc(g ? g.item : "")}" placeholder="e.g. Board game"></div>
        <div class="field"><label for="f-store">Store</label>
          <input id="f-store" type="text" autocomplete="off" autocapitalize="words" value="${esc(g ? g.store : "")}" placeholder="e.g. Target"></div>
        <div class="field"><label for="f-price">Price paid</label>
          <input id="f-price" inputmode="decimal" placeholder="$0" value="${g && g.price != null ? g.price : ""}"></div>
        <div class="field"><span class="lbl">Status</span>
          ${segHtml("status", STATUSES.map(s => ({ v: s, label: LABEL[s], cls: "st-" + s })), st, "flow")}</div>
        <div class="field" id="f-exp-wrap"><label for="f-exp">Expected delivery</label>
          <input id="f-exp" type="date" value="${g && g.expected ? esc(String(g.expected).slice(0, 10)) : ""}"></div>
        <div class="field"><label for="f-notes">Notes</label>
          <textarea id="f-notes" rows="3" maxlength="500" placeholder="Size, order number, where it's hidden…">${esc(g ? g.notes : "")}</textarea></div>
        ${forRow}
        ${actions(g ? `<button type="button" class="btn danger" id="f-del">Delete</button>` : "", g ? "Save" : "Add gift")}`,
      // New gift: type its name. "add price": type the price. Opening an existing gift: no keyboard.
      focus: !g ? "#f-item" : focus === "price" ? "#f-price" : null,
      onSubmit: async form => {
        const item = form.querySelector("#f-item").value.trim();
        const storeName = form.querySelector("#f-store").value.trim();
        const price = parseMoney(form.querySelector("#f-price").value);
        const status = picked(form, "status") || "idea";
        const notes = form.querySelector("#f-notes").value.trim();
        const exp = status === "ordered" ? (form.querySelector("#f-exp").value || null) : null;
        if (!item) { showErr(form, "Say what the gift is."); return false; }
        if (item.length > 200 || storeName.length > 120) { showErr(form, "That's too long. Shorten the gift or store name."); return false; }
        if (notes.length > 500) { showErr(form, "Keep notes under 500 characters."); return false; }
        if (Number.isNaN(price)) { showErr(form, "Enter the price as a dollar amount, like 24.99."); return false; }
        let forId = p ? p.id : null, forName = p ? p.name : "";
        if (pick) {
          const wrap = form.querySelector("#f-for-wrap");
          const choice = form.querySelector("#f-for-id").value;
          if (!choice) {
            showErr(form, "Pick who it's for.");
            wrap.scrollIntoView({ block: "center", behavior: reduceMotion() ? "auto" : "smooth" });
            return false;
          }
          if (choice === "new") {
            const nameBox = form.querySelector("#f-newname");
            forName = nameBox.value.trim();
            if (!forName) { showErr(form, "Type the new person's name."); nameBox.focus({ preventScroll: true }); return false; }
            if (forName.length > 80) { showErr(form, "Keep the name under 80 characters."); return false; }
            const r = await send("gift_save_person", { p_id: null, p_name: forName, p_budget: null, p_is_child: form.querySelector("#f-newkid").checked });
            if (!r.ok) return false;
            forId = r.value;
          } else {
            forId = choice;
            forName = (state.data.people.find(x => x.id === choice) || {}).name || "";
          }
        }
        const ok = await act("gift_save_gift", {
          p_id: g ? g.id : null, p_person_id: forId, p_item: item, p_store: storeName, p_price: price, p_status: status,
          p_notes: notes, p_bought_by: g ? g.bought_by : null, p_expected: exp   // keep any old shopper tag as it was
        });
        if (ok && pick) toast(`Added for ${forName}.`);
        return ok;
      },
      onReady: form => {
        if (pick) bindForSearch(form, order);
        const wrap = form.querySelector("#f-exp-wrap");
        const showExp = () => { wrap.hidden = picked(form, "status") !== "ordered"; };
        form.querySelectorAll('input[name="status"]').forEach(r => r.addEventListener("change", showExp));
        showExp();
        const del = form.querySelector("#f-del");
        if (del) armButton(del, "Delete this gift?", async () => {
          const copy = Object.assign({}, g);
          const ok = await act("gift_delete_gift", { p_id: g.id });
          if (ok) offerUndo("Gift deleted", () => act("gift_save_gift", Object.assign({ p_id: null }, giftArgs(copy, copy.person_id))));
          return ok;
        });
      }
    });
  }

  /* ---------- export ---------- */
  const COLS = ["Person", "Kid", "Person budget", "Gift", "Store", "Price", "Status", "Expected delivery", "Notes"];
  function csvCell(v) {
    let s = v == null ? "" : String(v);
    if (/^[=+\-@]/.test(s)) s = "'" + s;   // keep spreadsheet apps from treating text as a formula
    return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }
  function buildCsv(data) {
    const rows = [COLS];
    for (const p of data.people) {
      const gs = data.gifts.filter(g => g.person_id === p.id);
      const kid = p.is_child ? "Yes" : "";
      if (!gs.length) rows.push([p.name, kid, p.budget, "", "", "", "", "", ""]);
      for (const g of gs) rows.push([p.name, kid, p.budget, g.item, g.store, g.price, LABEL[statusOf(g)], g.expected ? String(g.expected).slice(0, 10) : "", g.notes]);
    }
    rows.push([]);
    const set = data.people.filter(p => p.budget != null);
    rows.push(["Overall budget", set.length ? Math.round(set.reduce((a, p) => a + p.budget, 0) * 100) / 100 : ""]);
    rows.push(["Exported", new Date().toLocaleString()]);
    return "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n") + "\r\n";
  }
  async function exportBackup() {
    // Use the list on screen (refreshed every few seconds) so the share sheet opens straight from the tap.
    // Returns true once the file is saved or shared, false if it was cancelled or failed.
    if (!state.data) { toast("Nothing to export yet."); return false; }
    const d = new Date();
    const stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const name = `christmas-gifts-${stamp}.csv`;
    const csv = buildCsv(state.data);
    let file = null;
    try { file = new File([csv], name, { type: "text/csv" }); } catch (_) {}
    let ok = false;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "Christmas gift list backup" }); ok = true; }
      catch (e) { if (e && e.name !== "AbortError") toast("Couldn't open the share sheet. Try again."); }
    } else {
      const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
      const a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast("Backup saved to your downloads.");
      ok = true;
    }
    if (ok && state.offline) toast("You're offline, so this backup is from " + new Date(state.syncedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + ".");
    return ok;
  }

  /* ---------- restore ---------- */
  function parseCsvText(text) {
    const rows = []; let row = []; let cell = ""; let q = false;
    text = text.replace(/^﻿/, "");
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += c;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  const unguard = s => /^'[=+\-@]/.test(s) ? s.slice(1) : s;
  function readBackup(text) {
    const rows = parseCsvText(text).map(r => r.map(c => unguard(c.trim())));
    const hi = rows.findIndex(r => r.some(c => c.toLowerCase() === "person") && r.some(c => c.toLowerCase() === "gift"));
    if (hi < 0) throw new Error("This doesn't look like a backup from the gift list. Pick a file made with Export a backup.");
    const head = rows[hi].map(c => c.toLowerCase());
    const col = name => head.indexOf(name.toLowerCase());
    const ix = { person: col("Person"), kid: col("Kid"), pbudget: col("Person budget"), gift: col("Gift"), store: col("Store"), price: col("Price"), status: col("Status"), by: col("Bought by"), exp: col("Expected delivery"), notes: col("Notes") };
    const get = (r, k) => ix[k] >= 0 && r[ix[k]] != null ? r[ix[k]] : "";
    const meta = {};
    const lines = [];
    let inData = true;
    for (let i = hi + 1; i < rows.length; i++) {
      const r = rows[i];
      if (r.every(c => c === "")) { inData = false; continue; }
      if (inData) lines.push(r); else if (r[0]) meta[r[0].toLowerCase()] = r[1] || "";
    }
    const s1 = meta["shopper 1"] || "", s2 = meta["shopper 2"] || "";
    const statusFrom = s => { const t = String(s).trim().toLowerCase(); return STATUSES.includes(t) ? t : "idea"; };
    const byFrom = s => { const t = String(s).trim().toLowerCase(); if (!t) return null; if (s1 && t === s1.toLowerCase()) return 1; if (s2 && t === s2.toLowerCase()) return 2; if (t === "shopper 1") return 1; if (t === "shopper 2") return 2; return null; };
    const people = []; const byName = new Map(); let giftCount = 0;
    for (const r of lines) {
      const name = get(r, "person").slice(0, 80);
      if (!name) continue;
      let p = byName.get(name);
      if (!p) {
        const b = parseMoney(get(r, "pbudget"));
        p = { name, budget: Number.isNaN(b) ? null : b, is_child: /^(yes|y|true|1)$/i.test(get(r, "kid")), gifts: [] };
        byName.set(name, p); people.push(p);
      }
      const item = get(r, "gift").slice(0, 200);
      if (!item) continue;
      const price = parseMoney(get(r, "price"));
      const exp = /^\d{4}-\d{2}-\d{2}$/.test(get(r, "exp")) ? get(r, "exp") : null;
      p.gifts.push({ item, store: get(r, "store").slice(0, 120), price: Number.isNaN(price) ? null : price, status: statusFrom(get(r, "status")), bought_by: byFrom(get(r, "by")), expected: exp, notes: get(r, "notes").slice(0, 500) });
      giftCount++;
    }
    if (!people.length) throw new Error("That backup doesn't have anyone in it, so there's nothing to restore.");
    const ob = parseMoney(meta["overall budget"] || "");
    return {
      data: { people, overall_budget: Number.isNaN(ob) ? null : ob, shopper1: s1 || null, shopper2: s2 || null },
      people: people.length, gifts: giftCount, exported: meta["exported"] || ""
    };
  }

  function restoreSheet() {
    const curPeople = state.data.people.length, curGifts = state.data.gifts.length;
    let parsed = null;
    openSheet({
      label: "Restore from a backup",
      title: "Restore from a backup",
      body: `<p>Pick a backup file you saved with <b>Export a backup</b>. Restoring replaces the whole list, on both phones, with what's in the file.</p>
        <div class="filepick btn wide">Choose backup file<input id="f-file" type="file" accept=".csv,text/csv,text/comma-separated-values,text/plain" aria-label="Choose backup file"></div>
        <div class="preview" id="f-preview" hidden></div>
        <p class="small">Your list right now: ${plural(curPeople, "person", "people")} and ${plural(curGifts, "gift", "gifts")}. If you might want it back, export a backup of it first.</p>
        <div class="err" aria-live="polite"></div>
        <div class="row-actions"><div class="right">
          <button type="button" class="btn danger" id="f-restore" disabled>Replace the list</button>
        </div></div>`,
      focus: null,
      onSubmit: null,
      onReady: form => {
        const input = form.querySelector("#f-file");
        const prev = form.querySelector("#f-preview");
        const btn = form.querySelector("#f-restore");
        let disarm = () => {};
        input.addEventListener("change", async () => {
          showErr(form, ""); prev.hidden = true; btn.disabled = true; parsed = null; disarm();
          const f = input.files && input.files[0];
          if (!f) return;
          if (f.size > 2 * 1024 * 1024) { showErr(form, "That file is too big to be a gift list backup."); return; }
          try {
            parsed = readBackup(await f.text());
            prev.innerHTML = `<span><b>${esc(f.name)}</b></span>
              <span>${plural(parsed.people, "person", "people")} and ${plural(parsed.gifts, "gift", "gifts")}${parsed.data.overall_budget != null ? `, overall budget ${money(parsed.data.overall_budget)}` : ""}</span>
              ${parsed.exported ? `<span>Exported ${esc(parsed.exported)}</span>` : ""}`;
            prev.hidden = false; btn.disabled = false;
          } catch (e) { showErr(form, e.message || "Couldn't read that file."); }
        });
        disarm = armButton(btn, "Tap again to replace the list", async () => {
          if (!parsed) return false;
          const ok = await act("gift_restore", { p_data: parsed.data });
          if (ok) { revealed.clear(); toast("List restored from the backup."); }
          return ok;
        });
      }
    });
  }

  /* ---------- start ---------- */
  render();
  refresh();
  setInterval(() => { if (document.visibilityState === "visible" && scrim.hidden) refresh(); }, POLL_MS);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
  window.addEventListener("focus", refresh);
  window.addEventListener("online", refresh);
})();
</script>
</body>
</html>
